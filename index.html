<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UPE BI PLATFORM</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: #103b80;
}

body {
    overflow-x: hidden;

    background:
        radial-gradient(
            ellipse at 75% 28%,
            rgba(187, 226, 250, .75),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #eaf6ff 0%,
            #d9effc 48%,
            #e8f7ff 100%
        );
}


/* =========================
   PAGE
========================= */

.page {
    min-height: 100vh;
    position: relative;

    padding: 28px 4vw 115px;

    overflow: hidden;
}


/* =========================
   BACKGROUND SHAPES
========================= */

.blob {
    position: absolute;
    pointer-events: none;
    z-index: 0;
}

.top-left {
    width: 390px;
    height: 250px;

    left: -170px;
    top: -125px;

    border-radius: 50%;

    background: #c8e6fb;

    transform: rotate(-25deg);
}

.top-wave {
    width: 120%;
    height: 190px;

    left: -10%;
    top: 205px;

    border-radius: 50% 50% 0 0 / 70% 70% 0 0;

    background: rgba(196, 229, 248, .48);
}


/* Bottom wave */

.bottom-wave {
    position: absolute;

    left: -5%;
    right: -5%;
    bottom: -100px;

    height: 250px;

    background:
        linear-gradient(
            180deg,
            #8cc9f6,
            #56aaf0
        );

    border-radius: 50% 50% 0 0 / 35% 35% 0 0;

    transform: rotate(-2deg);

    z-index: 0;
}

.bottom-wave::before {
    content: "";

    position: absolute;

    left: -2%;
    right: -2%;

    top: -25px;

    height: 70px;

    background: #d7effd;

    border-radius: 50%;
}


/* =========================
   HEADER
========================= */

header {
    position: relative;
    z-index: 2;

    display: flex;

    justify-content: center;
    align-items: flex-start;

    min-height: 220px;
}

.logo {
    width: 205px;

    display: block;
}


/* =========================
   HERO
========================= */

.hero {
    position: relative;
    z-index: 2;

    text-align: center;

    margin: 20px auto 50px;

    max-width: 1000px;
}

.hero h1 {
    margin: 0 0 22px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 64px;

    line-height: 1.05;

    color: #073b87;

    letter-spacing: .5px;
}


/* Decorative lines */

.hero h1::before,
.hero h1::after {
    content: "";

    display: inline-block;

    width: 38px;
    height: 10px;

    margin: 0 45px 15px 0;

    border-radius: 20px;

    background: #58b5f2;

    box-shadow:
        13px -25px 0 -2px #58b5f2,
        13px 25px 0 -2px #58b5f2;

    transform: rotate(-3deg);
}

.hero h1::after {
    margin: 0 0 15px 45px;

    transform: scaleX(-1);
}

.hero p {
    margin: 0;

    color: #4e7196;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 25px;
}


/* =========================
   CARDS
========================= */

.cards {
    position: relative;
    z-index: 2;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 24px;

    max-width: 1200px;

    margin: 0 auto;
}


/* Card */

.card {
    min-height: 285px;

    background: rgba(255,255,255,.92);

    border:
        1px solid
        rgba(255,255,255,.9);

    border-radius: 25px;

    padding:
        25px
        24px
        28px;

    box-shadow:
        0 12px 28px
        rgba(57,123,165,.13);

    position: relative;

    overflow: hidden;

    display: flex;

    flex-direction: column;
}


/* Decorative blue shape inside card */

.card::after {
    content: "";

    position: absolute;

    right: -25px;
    bottom: -42px;

    width: 170px;
    height: 90px;

    background:
        linear-gradient(
            135deg,
            #d7f0ff,
            #43a9ef
        );

    border-radius: 65% 0 0 0;

    transform: rotate(-8deg);

    opacity: .95;
}


/* Status */

.status {
    width: max-content;

    padding:
        8px
        15px;

    border-radius: 20px;

    background: #e5f3fc;

    color: #1763a8;

    font-weight: 700;

    font-size: 16px;

    position: relative;

    z-index: 1;
}


/* Green dot */

.status.live::before {
    content: "";

    display: inline-block;

    width: 11px;
    height: 11px;

    background: #42c96a;

    border-radius: 50%;

    margin-right: 9px;
}


/* Card title */

.card h2 {
    position: relative;

    z-index: 1;

    margin:
        30px
        0
        7px;

    font-size: 25px;

    line-height: 1.25;

    color: #083d86;
}


/* Arabic text */

.arabic {
    position: relative;

    z-index: 1;

    margin: 0;

    color: #6683a2;

    font-size: 17px;

    direction: rtl;

    text-align: left;
}


/* Open button (link styled as button) */

.open {
    margin-top: auto;

    align-self: flex-start;

    position: relative;

    z-index: 2;

    display: inline-block;

    text-decoration: none;

    border: 0;

    border-radius: 10px;

    padding:
        13px
        20px;

    background: #0878d5;

    color: white;

    font-weight: 700;

    font-size: 18px;

    box-shadow:
        0 7px 14px
        rgba(0,108,196,.18);

    cursor: pointer;

    transition: .2s;
}

.open:hover {
    background: #0568bc;

    transform: translateY(-2px);
}


/* =========================
   FOOTER
========================= */

.footer {
    position: relative;

    z-index: 2;

    text-align: center;

    margin:
        72px
        auto
        0;

    color: #52799e;

    font-size: 14px;
}


/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

    .cards {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .hero h1 {
        font-size: 52px;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .page {
        padding:
            20px
            18px
            90px;
    }


    header {
        min-height: 170px;
    }


    .logo {
        width: 160px;
    }

.hero {
        margin-top: 10px;
    }


    .hero h1 {
        font-size: 38px;
    }


    .hero h1::before,
    .hero h1::after {
        display: none;
    }


    .hero p {
        font-size: 18px;

        line-height: 1.45;
    }


    .cards {
        grid-template-columns: 1fr;

        gap: 18px;
    }


    .card {
        min-height: 240px;
    }
}

</style>
</head>
